name: Render AI digest mirror

on:
  push:
    branches:
      - main
    paths:
      - "docs/ai-digest-entries/**"
      - "scripts/render_ai_digest.py"
      - ".github/workflows/render-ai-digest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-ai-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Render, commit, and push with concurrency retry
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Render attempt ${attempt}/3"

            # Always render from the newest remote state so an entry added by a
            # concurrent writer cannot be omitted from the accumulated file.
            git fetch origin main
            git reset --hard origin/main

            python3 scripts/render_ai_digest.py
            git diff --check

            if git diff --quiet -- docs/ai-digest.md; then
              echo "Digest is already up to date."
              exit 0
            fi

            git add docs/ai-digest.md
            git commit -m "docs(ai-digest): render accumulated mirror"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Remote advanced during render; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Could not update digest after three concurrent-push retries." >&2
          exit 1
